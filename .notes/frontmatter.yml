version: 1

required:
  title:
    type: string
  category:
    type: string
  tags:
    type: array
    items: string
  date:
    type: date
    format: YYYY-MM-DD

recommended:
  description:
    type: string
  status:
    type: enum
    values:
      - draft
      - evergreen
      - needs-review
      - incomplete
  sources:
    type: array
    items:
      title: string
      url: string
      type: string
  updated:
    type: date
    format: YYYY-MM-DD

optional:
  authors:
    type: array
    items: string
    effect: credits_every_author_including_llm_models_that_edited_the_note
  archive:
    type: boolean
    effect: exclude_note_from_build_indexes_and_navigation
  notebook_page:
    type: boolean
    scope: notebook_first_markdown_cell
    default: true
    effect: false_keeps_the_notebook_embeddable_without_generating_a_standalone_note

conventions:
  title_lives_in_frontmatter: true
  no_in_body_h1: true
  tags_should_be_yaml_lists: true
  descriptions_should_state_scope_not_hype: true
  dates_should_be_iso8601: true
  source_urls_should_be_canonical_when_possible: true
  archive_true_removes_note_from_site_output: true
  authors_use_short_lowercase_slugs: true
  agents_append_their_model_slug_to_authors_when_editing_a_note: true
  absence_of_model_entries_in_authors_implies_human_only: true

backfill_targets:
  normalize_tags_to_yaml_lists: true
  add_sources_field_when_the_note_depends_on_external_material: true
  remove_in_body_h1_when_frontmatter_title_exists: true
